# Local development profile (SPRING_PROFILES_ACTIVE=dev). NEVER use these values in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crms_dev?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:crms}
spring.datasource.password=${DB_PASSWORD:crms_dev_pw}
app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-0123456789}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
