# Render Blueprint for the backend (Docker). The frontend is deployed on Vercel, the database elsewhere.
# Secrets are marked sync:false - Render asks for their values in the dashboard; nothing secret lives in git.
services:
  - type: web
    name: crms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free          # free instances sleep when idle and have limited resources; choose a paid plan for production
    envVars:
      - key: DB_URL               # jdbc:mysql://HOST:3306/DBNAME?sslMode=VERIFY_IDENTITY  (see README)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET           # random value, at least 32 characters
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS # exact frontend origin, e.g. https://your-app.vercel.app
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: COLLEGE_NAME
        value: Your College Name
      - key: BOOTSTRAP_ADMIN_USERNAME   # used once to create the first administrator, then remove both
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
