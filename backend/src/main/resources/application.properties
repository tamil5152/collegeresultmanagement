# ---- Production-safe defaults. Everything environment specific comes from environment variables. ----
spring.application.name=college-result-management
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# Database (MySQL 8). Use ?sslMode=VERIFY_IDENTITY or REQUIRED for cloud databases, see README.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

spring.jackson.time-zone=UTC
spring.mvc.problemdetails.enabled=false

# Application settings
app.college-name=${COLLEGE_NAME:College Result Management}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}
app.cookie.name=CRMS_TOKEN
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:System Administrator}

# API docs are off unless SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
